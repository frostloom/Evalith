[project]
name = "evalith"
version = "0.1.0"
description = "Evalith phase-1 project workspace: scoped local project access, persistent main sessions, and evidence-backed project understanding."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.17,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalith"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Static gate: syntax errors, undefined names, unused imports/variables and
# other pyflakes-level defects. Formatting and style rules stay out of the
# blocking gate.
select = ["E4", "E7", "E9", "F"]
